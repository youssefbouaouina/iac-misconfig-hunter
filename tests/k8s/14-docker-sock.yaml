apiVersion: v1
kind: Pod
metadata:
  name: docker-sock-pod
  namespace: demo
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
  volumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
