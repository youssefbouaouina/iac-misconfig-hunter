name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  scanners:
    name: Four scanners on 35 known misconfigurations
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned tools
        env:
          TRIVY_VERSION: 0.76.1
          KUBE_LINTER_VERSION: 0.8.3
        run: |
          pip install -r requirements-dev.txt
          pip install checkov==3.2.458
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          install -m 0755 trivy /usr/local/bin/trivy
          curl -sSfL -o kube-linter.tar.gz \
            "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-linux.tar.gz"
          tar -xzf kube-linter.tar.gz kube-linter
          install -m 0755 kube-linter /usr/local/bin/kube-linter
          trivy --version
          kube-linter version

      - name: Run the evaluation
        run: bash scripts/scan_all.sh

      - name: Gate — the 14 fixed findings are gone and the total went down
        run: python scripts/gate.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-results
          path: results/
