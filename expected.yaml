# Ground truth for the IaC scanner evaluation.
#
# Written by reading the TerraGoat source (its own comments list the intended
# weaknesses) and the deliberately vulnerable Kubernetes manifests in tests/k8s/.
# Committed BEFORE the first scanner run.
#
# An item counts as found by a scanner when that scanner reports at least one
# finding on the same file (or resource name, when the format has no file) whose
# check title/message matches one of the category keywords in mapping.yaml.
